openapi: 3.0.0
info:
  title: Get Order API
  description: API for managing orders in the e-commerce system
  version: 1.0.0
servers:
  - url: http://52.23.109.228:5002/api
    description: Deploy EC2
paths:
  /order/{order_id}:
    get:
      summary: Get order by ID
      description: Retrieve details of a specific order using its ID.
      parameters:
        - name: order_id
          in: path
          required: true
          description: The ID of the order
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found
  /order/user/{user_id}:
    get:
      summary: Get orders by user
      description: Retrieve all orders placed by a specific user.
      parameters:
        - name: user_id
          in: path
          required: true
          description: The ID of the user
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved user orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [Pending, Processing, Completed, Cancelled]
        total_price:
          type: number
          format: float
