version: '3.8'

services:
  stock-query-service:
    image: ciizao/stock-query-service:latest
    container_name: stock-query-service
    ports:
      - "8082:8082"
    environment:
      DB_HOST: ${DB_HOST_INVENTORY}
      DB_PORT: ${DB_PORT_INVENTORY}
      DB_USER: ${DB_USER_INVENTORY}
      DB_PASSWORD: ${DB_PASSWORD_INVENTORY}
      DB_NAME: ${DB_NAME_INVENTORY}
    networks:
      - inventory-network

  stock-reservation-service:
    image: ciizao/stock-reservation-service:latest
    container_name: stock-reservation-service
    ports:
      - "8083:8083"
    environment:
      DB_HOST: ${DB_HOST_INVENTORY}
      DB_PORT: ${DB_PORT_INVENTORY}
      DB_USER: ${DB_USER_INVENTORY}
      DB_PASSWORD: ${DB_PASSWORD_INVENTORY}
      DB_NAME: ${DB_NAME_INVENTORY}
    networks:
      - inventory-network

  stock-update-service:
    image: ciizao/stock-update-service:latest
    container_name: stock-update-service
    ports:
      - "8084:8084"
    environment:
      DB_HOST: ${DB_HOST_INVENTORY}
      DB_PORT: ${DB_PORT_INVENTORY}
      DB_USER: ${DB_USER_INVENTORY}
      DB_PASSWORD: ${DB_PASSWORD_INVENTORY}
      DB_NAME: ${DB_NAME_INVENTORY}
    networks:
      - inventory-network

networks:
  inventory-network:
    driver: bridge
