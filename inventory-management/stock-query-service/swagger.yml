openapi: 3.0.0
info:
  title: Stock Query Service API
  description: API to retrieve stock information for products
  version: 1.0.0
servers:
  - url: http://54.156.95.104:8080
    description: Deploy EC2
paths:
  /stock/{product_id}:
    get:
      summary: Get product stock information
      description: Retrieve the stock level of a product by its ID
      parameters:
        - name: product_id
          in: path
          required: true
          schema:
            type: string
          description: The unique identifier of the product
      responses:
        "200":
          description: Successful response with product stock details
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: "12345"
                  name:
                    type: string
                    example: "Notebook"
                  stock:
                    type: integer
                    example: 100
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Product not found"
