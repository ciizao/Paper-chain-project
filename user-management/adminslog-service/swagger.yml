openapi: 3.0.0
info:
  title: Admin Login Microservice
  description: API for authenticating administrators using FastAPI and PostgreSQL
  version: 1.0.0
servers:
  - url: http://3.220.99.156:8009
    description: Deploy EC2

paths:
  /admlogin:
    post:
      summary: Authenticate admin
      description: Validates admin credentials and returns a JWT token if successful.
      operationId: adminLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "200":
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: admin@example.com
        password:
          type: string
          format: password
          example: adminpassword

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
          example: fake_token_for_admin@example.com
        token_type:
          type: string
          example: bearer

    ErrorResponse:
      type: object
      properties:
        detail:
          type: string
          example: Invalid credentials

