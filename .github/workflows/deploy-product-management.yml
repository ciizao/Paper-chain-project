name: Deploy Product Managements

on:
  push:
    branches:
      - QA
    paths:
      - 'products-management/**' 

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v3

      - name: Configurar SSH y desplegar en EC2
        env:
          DB_HOST_PRODUCT: ${{ vars.DB_HOST_PRODUCT }}
          DB_PORT_PRODUCT: ${{ vars.DB_PORT_PRODUCT }}
          DB_USER_PRODUCT: ${{ vars.DB_USER_PRODUCT }}
          DB_PASSWORD_PRODUCT: ${{ vars.DB_PASSWORD_PRODUCT }}
          DB_NAME_PRODUCT: ${{ vars.DB_NAME_PRODUCT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          EC2_USER: "ec2-user"
          EC2_HOST: "18.234.5.75"
        run: |
          echo "$SSH_PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem
          
            cd /home/ec2-user/Paper-chain-project
            git pull origin QA

            export DB_HOST_PRODUCT="${DB_HOST_PRODUCT}"
            export DB_PORT_PRODUCT="${DB_PORT_PRODUCT}"
            export DB_USER_PRODUCT="${DB_USER_PRODUCT}"
            export DB_PASSWORD_PRODUCT="${DB_PASSWORD_PRODUCT}"
            export DB_NAME_PRODUCT="${DB_NAME_PRODUCT}"

            cd /home/ec2-user/Paper-chain-project/products-management
            bash deploy.sh
          EOF
